name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Verify tagged source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git tag --points-at HEAD)" = "$GITHUB_REF_NAME"
          make fmt-check
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          go mod verify
      - name: Build deterministic release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          commit="$(git rev-parse HEAD)"
          epoch="$(git show -s --format=%ct HEAD)"
          built_at="$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w \
            -X github.com/balyakin/crawlledger/internal/version.Version=$version \
            -X github.com/balyakin/crawlledger/internal/version.Commit=$commit \
            -X github.com/balyakin/crawlledger/internal/version.Date=$built_at"
          mkdir -p dist stage
          for target in \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="crawlledger_${version}_${goos}_${goarch}"
            directory="stage/$name"
            mkdir -p "$directory"
            binary="crawlledger"
            if test "$goos" = windows; then binary="crawlledger.exe"; fi
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "$directory/$binary" ./cmd/crawlledger
            cp README.md LICENSE NOTICE "$directory/"
            find "$directory" -exec touch -d "@$epoch" {} +
            if test "$goos" = windows; then
              (cd stage && zip -X -q -r "../dist/${name}.zip" "$name")
            else
              tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
                -C stage -cf - "$name" | gzip -n >"dist/${name}.tar.gz"
            fi
          done
          "stage/crawlledger_${version}_linux_amd64/crawlledger" version |
            grep -F "\"version\":\"$version\""
          (cd dist && sha256sum crawlledger_* >checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes \
            --notes "Schema version: 1. SQLite migration: 001_initial.sql."
