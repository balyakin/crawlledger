worker_processes 1;
pid /tmp/crawlledger-protect-nginx.pid;
error_log /tmp/crawlledger-protect-nginx-error.log notice;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/crawlledger-protect-client;
    proxy_temp_path /tmp/crawlledger-protect-proxy;
    fastcgi_temp_path /tmp/crawlledger-protect-fastcgi;
    uwsgi_temp_path /tmp/crawlledger-protect-uwsgi;
    scgi_temp_path /tmp/crawlledger-protect-scgi;

    include crawlledger-http.conf;

    limit_req_zone $binary_remote_addr zone=crawlledger_shadow_fixture:1m rate=1000r/s;

    server {
        listen 127.0.0.1:18081;
        server_name fixture.example;
        include crawlledger-server.conf;

        location /shadow/ {
            limit_req zone=crawlledger_shadow_fixture;
            root /tmp/crawlledger-protect-www;
            try_files /ok.txt =404;
        }

        location / {
            root /tmp/crawlledger-protect-www;
            try_files /ok.txt =404;
        }
    }
}
