# CrawlLedger protect http v1 site=example
map "$request_method|$uri" $crawlledger_example_fixture_emergency_key {
    default "";
    include crawlledger-active.map;
}

map $request_uri $crawlledger_example_fixture_static_deny {
    default 0;
    "~*(?:^|/)\\.env(?:[./?]|\\z)" 1;
    "~*(?:^|/)\\.git(?:/|\\?|\\z)" 1;
    "~*(?:^|/|\\\\|%2f|%5c)(?:\\.\\.|%2e%2e)(?:/|\\\\|%2f|%5c|\\?|\\z)" 1;
    "~*\\x24\\{jndi:" 1;
}

limit_req_zone $crawlledger_example_fixture_emergency_key
    zone=crawlledger_example_fixture_emergency:1m rate=1r/s;
