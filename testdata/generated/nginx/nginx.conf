user nobody nogroup;
error_log stderr;
pid /tmp/crawlledger-nginx.pid;

events {}
http {
    access_log off;
    client_body_temp_path /tmp/crawlledger-nginx-client;
    proxy_temp_path /tmp/crawlledger-nginx-proxy;
    fastcgi_temp_path /tmp/crawlledger-nginx-fastcgi;
    uwsgi_temp_path /tmp/crawlledger-nginx-uwsgi;
    scgi_temp_path /tmp/crawlledger-nginx-scgi;
    include ../../golden/nginx-http.conf;
    server {
        listen 18080;
        include ../../golden/nginx-server.conf;
        return 204;
    }
}
